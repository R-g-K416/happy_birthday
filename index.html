<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HBD Siri</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#heart {
    position: relative;
    width: 450px;
    height: 450px;
    max-width: 90vw;
    max-height: 90vw;
    overflow: visible;
}

.love {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 450px;
    height: 450px;
    margin-left: -225px;
    margin-top: -225px;
    pointer-events: none;
}

.love-horizontal {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;

    animation:
        moveHorizontal
        10s
        infinite
        alternate
        ease-in-out;
}

.love-vertical {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;

    animation:
        moveVertical
        20s
        infinite
        linear;
}

.love-word {
    position: absolute;
    left: 0;
    top: 0;

    color: #ff4fa3;

    font-family:
        Arial,
        sans-serif;

    font-size: 12px;
    font-weight: 400;

    white-space: nowrap;
    letter-spacing: 1px;

    transform:
        translateY(-100%)
        rotateZ(-30deg);

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff4fa3,
        0 0 25px #ff4fa3;

    user-select: none;
}

@keyframes moveHorizontal {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(450px);
    }
}

@keyframes moveVertical {

    0% {
        transform: translateY(180px);
    }

    10% {
        transform: translateY(45px);
    }

    15% {
        transform: translateY(5px);
    }

    18% {
        transform: translateY(0);
    }

    20% {
        transform: translateY(5px);
    }

    22% {
        transform: translateY(35px);
    }

    24% {
        transform: translateY(64px);
    }

    25% {
        transform: translateY(112px);
    }

    26% {
        transform: translateY(64px);
    }

    28% {
        transform: translateY(35px);
    }

    30% {
        transform: translateY(5px);
    }

    32% {
        transform: translateY(0);
    }

    35% {
        transform: translateY(5px);
    }

    40% {
        transform: translateY(45px);
    }

    50% {
        transform: translateY(180px);
    }

    71% {
        transform: translateY(428px);
    }

    72.5% {
        transform: translateY(441px);
    }

    75% {
        transform: translateY(450px);
    }

    77.5% {
        transform: translateY(441px);
    }

    79% {
        transform: translateY(428px);
    }

    100% {
        transform: translateY(180px);
    }
}

@media (max-width: 600px) {

    #heart {
        transform: scale(.72);
    }
}
</style>
</head>

<body>

<div id="heart"></div>

<script>

];

const heart = document.getElementById("heart");

words.forEach((text, index) => {

    const item = document.createElement("div");
    item.className = "love";

    const horizontal = document.createElement("div");
    horizontal.className = "love-horizontal";

    const vertical = document.createElement("div");
    vertical.className = "love-vertical";

    const word = document.createElement("div");
    word.className = "love-word";

    word.textContent = text;

    const delay = -(index + 1) * 0.22;

    horizontal.style.animationDelay =
        delay + "s";

    vertical.style.animationDelay =
        delay + "s";

    horizontal.appendChild(vertical);
    vertical.appendChild(word);
    item.appendChild(horizontal);
    heart.appendChild(item);
});
